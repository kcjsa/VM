<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guacamole Gateway</title>
    <style>
        body {
            background: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #status {
            color: #aaa;
            margin-bottom: 10px;
            font-size: 14px;
        }
        #url-box {
            background: #1a1f2b;
            color: #7dffb3;
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid #2a3344;
            font-size: 16px;
            word-break: break-all;
            max-width: 90%;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        #url-box:hover {
            background: #2a3344;
        }
        #url-box a {
            color: #7dffb3;
            text-decoration: none;
        }
        #loading {
            color: #fff;
            font-size: 18px;
        }
        .btn {
            margin-top: 20px;
            padding: 12px 32px;
            background: #2d7aff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background: #1a5fd0;
        }
        .note {
            color: #666;
            font-size: 12px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div id="status">⏳ 接続準備中...</div>
    <div id="loading">🔄 トンネル起動中...</div>
    <div id="url-box" style="display:none;">
        <a href="#" target="_blank" id="tunnelLink">ここをクリックして開く</a>
    </div>
    <button class="btn" id="retryBtn" style="display:none;" onclick="startTunnel()">🔄 再試行</button>
    <div class="note" id="note" style="display:none;">☝️ クリックすると別タブで開きます</div>

    <script>
        const API_WORKER = 'https://url.kurea-ch124.workers.dev/start';
        const API_WORKER_TAILSCALE = 'https://url.kurea-ch124.workers.dev/start?t=tailscale';
        const TOKEN = 'M0TrSmymz3L9rMEO5KOd6XE1XOD3zJxI';
        const TIMEOUT = 30000;

        const statusEl = document.getElementById('status');
        const loadingEl = document.getElementById('loading');
        const urlBox = document.getElementById('url-box');
        const tunnelLink = document.getElementById('tunnelLink');
        const retryBtn = document.getElementById('retryBtn');
        const note = document.getElementById('note');

        function setStatus(msg, type = 'loading') {
            statusEl.textContent = msg;
            statusEl.className = type;
        }

        function showError(msg) {
            loadingEl.style.display = 'none';
            urlBox.style.display = 'none';
            note.style.display = 'none';
            setStatus('❌ ' + msg, 'error');
            retryBtn.style.display = 'inline-block';
        }

        function showUrl(url) {
            loadingEl.style.display = 'none';
            setStatus('✅ トンネル起動完了！', 'success');
            urlBox.style.display = 'block';
            tunnelLink.href = url + '/guacamole';
            tunnelLink.textContent = url + '/guacamole';
            note.style.display = 'block';
            retryBtn.style.display = 'none';
        }

        function fetchWithTimeout(url, options, timeout) {
            return Promise.race([
                fetch(url, options),
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('Timeout')), timeout)
                )
            ]);
        }

        async function callAPI(apiUrl) {
            const res = await fetchWithTimeout(apiUrl, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${TOKEN}` }
            }, TIMEOUT);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (!data.tunnel_url) throw new Error('No tunnel_url');
            return data.tunnel_url;
        }

        async function startTunnel() {
            setStatus('🔄 接続中...', 'loading');
            loadingEl.style.display = 'block';
            urlBox.style.display = 'none';
            note.style.display = 'none';
            retryBtn.style.display = 'none';

            const apis = [
                { name: 'Cloudflare', url: API_WORKER },
                { name: 'Tailscale', url: API_WORKER_TAILSCALE }
            ];

            for (const api of apis) {
                try {
                    setStatus(`🔄 ${api.name}経由で接続中...`, 'loading');
                    const tunnelUrl = await callAPI(api.url);
                    console.log(`✅ ${api.name} tunnel:`, tunnelUrl);

                    // URLを表示（クリックで開く）
                    showUrl(tunnelUrl);
                    return;
                } catch (e) {
                    console.warn(`⚠️ ${api.name} failed:`, e.message);
                }
            }

            showError('全ての接続方法が失敗しました');
        }

        // 自動起動
        startTunnel();
    </script>

</body>
</html>
